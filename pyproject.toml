[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-traffic-risk-scenario"
version = "0.1.0"
description = "Deterministic CARLA scenario generation and risk-tube labelling for VN-Traffic Risk."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
video = ["imageio-ffmpeg>=0.5"]

[project.scripts]
vn-risk-run = "vn_traffic_risk.cli:main"
vn-risk-video = "vn_traffic_risk.video:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
